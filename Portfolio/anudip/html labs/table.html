<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Items and Prices</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h2 {
            text-align: center;
            background-color: #2c2c2c;
            color: white;
            padding: 10px;
        }

        /* Assignment 1 Table */
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 300px;
            background-color: white;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th {
            background-color: #1e90ff;
            color: white;
            font-weight: bold;
            padding: 8px;
        }

        td {
            padding: 8px;
            font-weight: bold;
            text-align: center;
        }

        /* Assignment 2 Form */
        .container {
            width: 350px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }

        label {
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 6px;
            margin-bottom: 10px;
        }

        button {
            background-color: #1e90ff;
            color: white;
            padding: 8px;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        button:hover {
            background-color: #0f6fdc;
        }

        .total {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Assignment 1 -->
    <h2>Sample Online Items and Prices</h2>

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>$800</td>
        </tr>
        <tr>
            <td>Smartphone</td>
            <td>$400</td>
        </tr>
        <tr>
            <td>Headphones</td>
            <td>$50</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>$300</td>
        </tr>
    </table>

    <!-- Assignment 2 -->
    <div class="container">
        <label>Laptop ($800 each)</label>
        <input type="number" id="laptop" value="0">

        <label>Smartphone ($400 each)</label>
        <input type="number" id="phone" value="0">

        <label>Headphones ($50 each)</label>
        <input type="number" id="headphones" value="0">

        <label>Tablet ($300 each)</label>
        <input type="number" id="tablet" value="0">

        <button onclick="calculateTotal()">Calculate Total Price</button>

        <div class="total">
            Total Price: $<span id="total">0</span>
        </div>
    </div>

    <script>
        function calculateTotal() {
            let laptop = document.getElementById("laptop").value * 800;
            let phone = document.getElementById("phone").value * 400;
            let headphones = document.getElementById("headphones").value * 50;
            let tablet = document.getElementById("tablet").value * 300;

            let totalPrice = laptop + phone + headphones + tablet;

            document.getElementById("total").innerText = totalPrice;
        }
    </script>

</body>
</html>
