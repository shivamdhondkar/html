<!-- PERFECTED signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --glass-bg: rgba(255,255,255,0.95);
            --glass-border: rgba(255,255,255,0.5);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--secondary-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .signup-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }
        .signup-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.15);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            position: relative;
        }
        .signup-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--primary-gradient);
        }
        .signup-header {
            background: var(--primary-gradient);
            color: white;
            padding: 2.5rem 2.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .signup-header::after {
            content: '';
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .header-icon {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            backdrop-filter: blur(10px);
            font-size: 2rem;
        }
        .form-content {
            padding: 2.5rem;
        }
        .input-group-custom {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-group-custom input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid #e9ecef;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            background: white;
            transition: all 0.3s ease;
            height: 64px;
        }
        .input-group-custom input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
            transform: translateY(-1px);
        }
        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 18px;
            z-index: 2;
        }
        .btn-primary-custom {
            background: var(--primary-gradient);
            border: none;
            border-radius: 16px;
            padding: 16px 32px;
            font-weight: 600;
            font-size: 16px;
            height: 64px;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 24px rgba(102,126,234,0.3);
        }
        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 32px rgba(102,126,234,0.4);
        }
        .btn-secondary-custom {
            border-radius: 16px;
            padding: 14px 24px;
            font-weight: 500;
            height: 56px;
            border: 2px solid;
            transition: all 0.3s ease;
        }
        .divider-custom {
            position: relative;
            text-align: center;
            margin: 2rem 0;
            color: #6c757d;
            font-size: 14px;
        }
        .divider-custom::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #dee2e6, transparent);
        }
        .divider-custom span {
            background: var(--glass-bg);
            padding: 0 24px;
            position: relative;
        }
        .password-strength {
            height: 6px;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
            background: #e9ecef;
        }
        .strength-fill {
            height: 100%;
            transition: all 0.3s ease;
        }
        .strength-weak { background: #dc3545; width: 30%; }
        .strength-fair { background: #ffc107; width: 60%; }
        .strength-strong { background: #28a745; width: 100%; }
        .form-check-custom {
            padding: 16px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            background: white;
        }
        .form-check-custom:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .form-check-input-custom:checked {
            background-color: #667eea;
            border-color: #667eea;
            transform: scale(1.1);
        }
        @media (max-width: 576px) {
            .form-content { padding: 2rem 1.5rem; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-card">
            <!-- Header -->
            <div class="signup-header">
                <div class="header-icon">
                    <i class="fas fa-user-plus text-white"></i>
                </div>
                <h1 class="h3 fw-bold mb-2">Create Your Account</h1>
                <p class="mb-0 opacity-90">Join thousands of readers on BookStore</p>
            </div>

            <!-- Form -->
            <div class="form-content">
                <form id="signupForm">
                    <!-- Full Name -->
                    <div class="input-group-custom">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="fullName" placeholder="Full Name *" required>
                    </div>

                    <!-- Phone -->
                    <div class="input-group-custom">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" id="phone" placeholder="Phone Number *" required>
                    </div>

                    <!-- Email -->
                    <div class="input-group-custom">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="Email Address *" required>
                    </div>

                    <!-- City -->
                    <div class="input-group-custom">
                        <i class="fas fa-map-marker-alt input-icon"></i>
                        <input type="text" id="city" placeholder="City">
                    </div>

                    <!-- Password -->
                    <div class="input-group-custom">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Create Password (8+ chars) *" required>
                        <button type="button" class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-3" id="togglePassword" style="background: none; border: none; color: #6c757d; z-index: 3;">
                            <i class="fas fa-eye"></i>
                        </button>
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="input-group-custom">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm Password *" required>
                    </div>

                    <!-- Terms -->
                    <div class="form-check-custom" onclick="toggleTerms()">
                        <input class="form-check-input form-check-input-custom position-absolute" type="checkbox" id="terms" required>
                        <label class="form-check-label w-100 h-100 p-0 m-0 d-flex align-items-center" for="terms" style="cursor: pointer;">
                            I agree to the <a href="/signup" class="text-decoration-none fw-semibold" style="color: #667eea;">Terms of Service</a> and 
                            <a href="/signup" class="text-decoration-none fw-semibold ms-1" style="color: #667eea;">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- Signup Button -->
                    <button type="submit" class="btn btn-primary-custom mb-4 shadow-lg" id="signupBtn" disabled>
                        <i class="fas fa-user-plus me-2"></i>Create Account
                    </button>

                    <!-- Social -->
                    <div class="divider-custom">
                        <span>or continue with</span>
                    </div>
                    <button type="button" class="btn btn-danger btn-secondary-custom w-100 mb-3">
                        <i class="fab fa-google me-2"></i>Google
                    </button>
                    <button type="button" class="btn btn-primary btn-secondary-custom w-100 mb-4">
                        <i class="fab fa-facebook-f me-2"></i>Facebook
                    </button>

                    <!-- Login Link -->
                    <div class="text-center pt-3">
                        <p class="mb-0 text-muted small">
                            Already have an account? 
                            <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign in</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('signupForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const toggleBtn = document.getElementById('togglePassword');
        const strengthBar = document.getElementById('passwordStrength');
        const signupBtn = document.getElementById('signupBtn');
        const terms = document.getElementById('terms');

        // Toggle password
        toggleBtn.addEventListener('click', () => {
            const type = password.type === 'password' ? 'text' : 'password';
            password.type = confirmPassword.type = type;
            toggleBtn.querySelector('i').classList.toggle('fa-eye');
            toggleBtn.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // Password strength
        password.addEventListener('input', () => {
            const val = password.value;
            const strength = calculateStrength(val);
            strengthBar.innerHTML = `<div class="strength-fill ${strength.class}"></div>`;
            validateForm();
        });

        // Confirm password
        confirmPassword.addEventListener('input', validateForm);
        terms.addEventListener('change', validateForm);

        function calculateStrength(str) {
            let score = 0;
            if (str.length >= 8) score++;
            if (/[a-z]/.test(str)) score++;
            if (/[A-Z]/.test(str)) score++;
            if (/[0-9]/.test(str)) score++;
            if (/[^a-zA-Z0-9]/.test(str)) score++;
            
            if (score <= 2) return {class: 'strength-weak'};
            if (score <= 4) return {class: 'strength-fair'};
            return {class: 'strength-strong'};
        }

        function validateForm() {
            const passValid = password.value.length >= 8;
            const passMatch = confirmPassword.value === password.value;
            const termsChecked = terms.checked;
            
            signupBtn.disabled = !(passValid && passMatch && termsChecked);
            signupBtn.style.opacity = signupBtn.disabled ? '0.6' : '1';
        }

        // Terms checkbox toggle
        function toggleTerms() {
            terms.checked = !terms.checked;
            terms.dispatchEvent(new Event('change'));
        }

        // Form submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = {
                name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                city: document.getElementById('city').value
            };
            localStorage.setItem('user', JSON.stringify(user));
            alert('🎉 Welcome to BookStore!');
            window.location.href = 'login.html';
        });
    </script>
</head>
<body>
