<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookStore - Home</title>
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
  />
  <link
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          rel="stylesheet"
  />
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    /* NAVBAR STYLING */
    .navbar-custom {
      background: var(--primary-gradient) !important;
      box-shadow: 0 4px 20px rgba(0, 123, 255, 0.3) !important;
      backdrop-filter: blur(10px);
    }
    .nav-link-custom {
      color: rgba(255, 255, 255, 0.95) !important;
      background: var(--glass-bg) !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: 25px !important;
      padding: 12px 24px !important;
      margin: 0 8px !important;
      transition: all 0.3s ease !important;
      font-weight: 500 !important;
      font-size: 0.95rem !important;
    }
    .nav-link-custom:hover {
      transform: translateY(-3px) scale(1.05) !important;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2) !important;
      color: white !important;
      background: rgba(255, 255, 255, 0.2) !important;
    }

    .icon-btn {
      width: 48px !important;
      height: 48px !important;
      border-radius: 50% !important;
      border: 2px solid var(--glass-border) !important;
      background: var(--glass-bg) !important;
      color: white !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-decoration: none !important;
      transition: all 0.3s ease !important;
    }

    .icon-btn:hover {
      transform: scale(1.1) !important;
      background: rgba(255, 255, 255, 0.2) !important;
    }

    .search-container {
      max-width: 400px;
      flex-grow: 1;
    }
    .book-card {
      transition: all 0.3s ease !important;
      border: none !important;
      border-radius: 20px !important;
      overflow: hidden !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1) !important;
    }
    .book-card:hover {
      transform: translateY(-10px) !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2) !important;
    }
    .main-content {
      min-height: calc(100vh - 200px);
    }
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3 me-4 p-2 rounded-pill" th:href="@{/}"
       style="background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); color: white; text-decoration: none;">
      <i class="fas fa-book-open-reader me-2 text-warning"></i>BookStore
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <i class="fas fa-bars"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link-custom active fs-6" th:href="@{/}"><i class="fas fa-home me-2"></i>Home</a>
        </li>
      </ul>

      <form class="search-container me-4 d-flex">
        <div class="input-group rounded-pill bg-white shadow-sm overflow-hidden flex-grow-1">
          <input class="form-control border-0 px-4 py-2" type="search" placeholder="Search books..." />
          <button class="btn btn-warning px-4" type="submit"><i class="fas fa-search"></i></button>
        </div>
      </form>

      <ul class="navbar-nav">
        <li class="nav-item me-2 position-relative">
          <a class="nav-link p-2 text-white" href="Index">
            <i class="fas fa-heart fs-4"></i>
            <span class="badge bg-danger position-absolute top-0 start-100 translate-middle">2</span>
          </a>
        </li>

        <li class="nav-item me-2 position-relative">
          <a href="/cart" class="nav-link p-2 text-white position-relative">
            <i class="fas fa-shopping-cart fs-4"></i>
            <span class="badge bg-success position-absolute top-0 start-100 translate-middle">3</span>
          </a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link p-0 icon-btn dropdown-toggle" href="/index" data-bs-toggle="dropdown">
            <i class="fas fa-user-circle"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-0 mt-2" style="border-radius: 15px">
            <li class="px-4 py-3 border-bottom bg-light">
              <h6 class="fw-bold mb-1">John Doe</h6>
              <small class="text-muted">john@email.com</small>
            </li>
            <li><a class="dropdown-item py-3 px-4" href="/index"><i class="fas fa-user me-3 text-primary"></i>Profile</a></li>
            <li><a class="dropdown-item py-3 px-4" href="/index"><i class="fas fa-box me-3 text-success"></i>Orders</a></li>
            <li><hr class="my-0 mx-3" /></li>
            <li><a class="dropdown-item text-danger py-3 px-4 fw-bold" href="/admin-login"><i class="fas fa-sign-out-alt me-3"></i>Logout</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="main-content py-5">
  <div class="container">
    <div class="row align-items-center mb-5">
      <div class="col-lg-6">
        <h1 class="display-4 fw-bold mb-4 text-dark">Welcome to <span class="text-primary">BookStore</span></h1>
        <p class="lead fs-4 text-muted mb-5">Discover millions of books from your favorite authors.</p>
      </div>
      <div class="col-lg-6 text-center">
        <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400&h=300&fit=crop" class="img-fluid rounded-4 shadow-lg" alt="Hero" />
      </div>
    </div>

    <div class="row g-4">
      <div class="col-xl-3 col-lg-4 col-md-6">
        <div class="card h-100 book-card">
          <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400&h=300&fit=crop" class="card-img-top" alt="Book" />
          <div class="card-body">
            <span class="badge bg-secondary mb-2">BK001</span>
            <h5 class="card-title fw-bold mt-2">The Great Gatsby</h5>
            <p class="text-muted mb-3">F. Scott Fitzgerald</p>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h4 class="text-primary mb-0 fw-bold">$19.99</h4>
              <span class="badge bg-success">In Stock</span>
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-success py-2 fw-bold">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-white py-5 mt-auto text-center">
  <div class="container">
    <p class="mb-0">&copy; 2026 BookStore. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
